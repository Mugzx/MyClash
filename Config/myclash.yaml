    path: './ruleset/geolocation-!cn.mrs'
    path-in-bundle: 'geo/geosite/geolocation-!cn.mrs'

# 路由规则
rules:
  # 内网直连
  - RULE-SET,private,本地直连
  - RULE-SET,private_ip,本地直连,no-resolve

  # 国内直连
  - RULE-SET,games_cn,本地直连 # 已包含 steam 下载域名
  - RULE-SET,steam_asn,本地直连,no-resolve
  - RULE-SET,microsoft_cn,本地直连
  - DOMAIN,auroraoss.com,本地直连 # 避免 Aurora Store 无法匿名

  # 禁用国外 QUIC 流量
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,geolocation-cn),(RULE-SET,cn_ip,no-resolve)))))),REJECT

  # 广告拦截
  - RULE-SET,adblockmihomo,广告拦截

  # 代理规则
  - RULE-SET,ai,AI
  - RULE-SET,googlefcm,FCM
  - RULE-SET,games,Games
  - RULE-SET,github,GitHub
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,x,X
  - RULE-SET,x_ip,X,no-resolve

  # 兜底规则
  - RULE-SET,geolocation-!cn,默认代理
  - RULE-SET,geolocation-cn,本地直连
  - RULE-SET,cn_ip,本地直连
  - MATCH,漏网之鱼
